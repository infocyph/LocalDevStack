services:
  server-tools:
    container_name: SERVER_TOOLS
    hostname: local-dock
    image: ${LDS_TOOLS_IMAGE:-infocyph/tools:latest}
    restart: unless-stopped
    environment:
      - TZ=${TZ:-}
      - HOST_OS=${HOST_OS:-}
      - USERNAME=${USER}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - GIT_CREDENTIAL_MODE=${GIT_CREDENTIAL_MODE:-auto}
      - SOPS_BASE_DIR=/etc/share/sops
      - SOPS_KEYS_DIR=/etc/share/sops/keys
      - SOPS_CFG_DIR=/etc/share/sops/config
      - SOPS_GLOBAL_DIR=/etc/share/sops/global
      - SOPS_REPO_DIR=/etc/share/vhosts/sops
      - COMPOSE_PROFILES=${COMPOSE_PROFILES:-}
      - LDS_AI_ENABLED=${LDS_AI_ENABLED:-auto}
      - LDS_AI_PROVIDER=${LDS_AI_PROVIDER:-ollama}
      - LDS_AI_URL=${LDS_AI_URL:-http://llm-sm:11434}
      - LDS_AI_MODEL=${LDS_AI_MODEL:-qwen2.5:3b}
      - LDS_AI_CONNECT_TIMEOUT
      - LDS_AI_PREFLIGHT_TIMEOUT
      - LDS_AI_TIMEOUT
      - LDS_AI_AVAILABILITY_TTL
      - LDS_AI_MAX_CONTEXT_BYTES
      - LDS_AI_MAX_REQUEST_BYTES
      - LDS_AI_MAX_RESPONSE_BYTES
    volumes:
      - "${PROJECT_DIR:-./../../../application}:/app"
      - lds_ssl_roots:/etc/share/rootCA
      - lds_apache_host:/etc/share/vhosts/apache
      - lds_nginx_host:/etc/share/vhosts/nginx
      - lds_ssl_keys:/etc/mkcert
      - lds_fpm_pools:/etc/share/vhosts/fpm
      - lds_composer_global:/etc/share/vhosts/composer
      - lds_git_config:/git-config
      - lds_tools_state:/etc/share/state
      - ../../configuration/compose:/etc/share/vhosts/docker-compose
      - ../../configuration/scheduler/cron-jobs:/etc/share/scheduler/cron-jobs
      - ../../configuration/scheduler/supervisor:/etc/share/scheduler/supervisor
      - ../../configuration/sops/config:/etc/share/sops/config
      - ../../configuration/sops/global:/etc/share/sops/global
      - ../../configuration/sops/keys:/etc/share/sops/keys
      - "../../configuration/ssh:/home/root/.ssh:ro"
      - "${SOP_REPO:-./../../../sops-repo}:/etc/share/vhosts/sops"
      - ../../configuration/ssl:/etc/share/certs
      - ../../logs:/global/log:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - frontend
      - backend
      - datastore

  runner:
    container_name: RUNNER
    hostname: runner
    image: ${LDS_RUNNER_IMAGE:-infocyph/runner:latest}
    restart: unless-stopped
    environment:
      - TZ=${TZ:-}
    volumes:
      - ../../configuration/scheduler/supervisor:/etc/supervisor/conf.d:ro
      - ../../configuration/scheduler/cron-jobs:/etc/cron.d:ro
      - ../../logs/runner:/var/log/supervisor
      - ../../logs/apache:/global/log/apache
      - ../../logs/cloudbeaver:/global/log/cloudbeaver
      - ../../logs/elasticsearch:/global/log/elasticsearch
      - ../../logs/kibana:/global/log/kibana
      - ../../logs/mariadb:/global/log/mariadb
      - ../../logs/mongo-express:/global/log/mongo-express
      - ../../logs/mongodb:/global/log/mongodb
      - ../../logs/mysql:/global/log/mysql
      - ../../logs/nginx:/global/log/nginx
      - ../../logs/postgresql:/global/log/postgresql
      - ../../logs/redis:/global/log/redis
      - ../../logs/redis-insight:/global/log/redis-insight
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      server-tools:
        condition: service_healthy
    networks:
      - backend

  mailpit:
    container_name: MAILPIT
    hostname: mailpit
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-}
      - MP_MAX_MESSAGES=5000
      - MP_DATABASE=/data/mailpit.db
      - MP_SMTP_TLS_CERT=/certs/lds-server.pem
      - MP_SMTP_TLS_KEY=/certs/lds-server-key.pem
      - MP_SMTP_REQUIRE_STARTTLS=true
      - MP_SMTP_AUTH_ACCEPT_ANY=1
    volumes:
      - lds_ssl_keys:/certs:ro
      - lds_mail:/data
    depends_on:
      server-tools:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8025/" ]
      interval: 10s
      timeout: 3s
      retries: 10
