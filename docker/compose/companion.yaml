services:
  server-tools:
    container_name: SERVER_TOOLS
    hostname: local-dock
    image: infocyph/tools:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-}
      - USERNAME=${USER}
    volumes:
      - lds_apache_host:/etc/share/vhosts/apache
      - lds_nginx_host:/etc/share/vhosts/nginx
      - ../../configuration/node:/etc/share/vhosts/node
      - ../../configuration/sops/config:/etc/share/sops/config
      - ../../configuration/sops/global:/etc/share/sops/global
      - ../../configuration/sops/keys:/etc/share/sops/keys
      - lds_ssl_keys:/etc/mkcert
      - "../../configuration/ssh:/home/root/.ssh:ro"
      - "${PROJECT_DIR:-./../../../application}:/app"
      - lds_ssl_roots:/etc/share/rootCA
      - /var/run/docker.sock:/var/run/docker.sock
      - "${SOP_REPO:-./../../../sops-repo}:/etc/share/vhosts/sops"
      - "${HOME}/.gitconfig:/home/root/.gitconfig:ro"
      - lds_fpm_pools:/etc/share/vhosts/fpm
      - ../../logs:/global/log:ro
      - ../../configuration/ssl:/etc/share/certs
    networks:
      frontend:
        ipv4_address: 172.28.0.13
      backend:
        ipv4_address: 172.29.0.10
      datastore:
        ipv4_address: 172.30.0.10

  runner:
    container_name: RUNNER
    hostname: runner
    image: infocyph/runner:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-}
    volumes:
      - ../../configuration/scheduler/supervisor:/etc/supervisor/conf.d:ro
      - ../../configuration/scheduler/cron-jobs:/etc/cron.d:ro
      - ../../logs/runner:/var/log/supervisor
      - ../../logs/apache:/global/log/apache
      - ../../logs/cloudbeaver:/global/log/cloudbeaver
      - ../../logs/elasticsearch:/global/log/elasticsearch
      - ../../logs/kibana:/global/log/kibana
      - ../../logs/mariadb:/global/log/mariadb
      - ../../logs/mongo-express:/global/log/mongo-express
      - ../../logs/mongodb:/global/log/mongodb
      - ../../logs/mysql:/global/log/mysql
      - ../../logs/nginx:/global/log/nginx
      - ../../logs/postgresql:/global/log/postgresql
      - ../../logs/redis:/global/log/redis
      - ../../logs/redis-insight:/global/log/redis-insight
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - server-tools
    networks:
      backend:
        ipv4_address: 172.29.0.11

  mailpit:
    container_name: MAILPIT
    hostname: mailpit
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-}
      - MP_MAX_MESSAGES=5000
      - MP_DATABASE=/data/mailpit.db
      - MP_SMTP_TLS_CERT=/certs/local.pem
      - MP_SMTP_TLS_KEY=/certs/local-key.pem
      - MP_SMTP_REQUIRE_STARTTLS=true
      - MP_SMTP_AUTH_ACCEPT_ANY=1
    volumes:
      - ../../data/mailpit:/data
      - lds_ssl_keys:/certs:ro
    depends_on:
      - server-tools
    networks:
      frontend:
        ipv4_address: 172.28.0.12
      backend:
        ipv4_address: 172.29.0.12
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8025/" ]
      interval: 10s
      timeout: 3s
      retries: 10
