x-db-client-service: &db-client-service
  restart: unless-stopped
  networks:
    datastore: {}
    frontend: {}

services:
  redis-insight:
    <<: *db-client-service
    container_name: REDIS_INSIGHT
    hostname: redis-insight
    image: redis/redisinsight:latest
    profiles: [redis]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - RI_REDIS_HOST=redis
    volumes:
      - lds_ri:/data
      - ../../logs/redis-insight:/var/log/redis-insight

  cloudbeaver:
    <<: *db-client-service
    container_name: CLOUD_BEAVER
    hostname: cloud-beaver
    image: dbeaver/cloudbeaver:latest
    profiles: [mysql, mariadb, postgresql]
    environment:
      - TZ=${TZ:-}
    volumes:
      - lds_cb:/opt/cloudbeaver/workspace
      - ../../logs/cloudbeaver:/opt/cloudbeaver/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8978/"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongo-express:
    <<: *db-client-service
    container_name: MONGO_EXPRESS
    hostname: mongo-express
    image: mongo-express:${MONGO_EXPRESS_VERSION:-latest}
    profiles: [mongodb]
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - TZ=${TZ:-}
      - ME_CONFIG_BASICAUTH=false
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGODB_ROOT_USERNAME:-root}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGODB_ROOT_PASSWORD:-12345}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGODB_ROOT_USERNAME:-root}:${MONGODB_ROOT_PASSWORD:-12345}@mongodb:${MONGODB_PORT:-27017}/admin
    volumes:
      - ../../logs/mongo-express:/var/log/mongo-express

  kibana:
    <<: *db-client-service
    container_name: KIBANA
    hostname: kibana
    image: docker.elastic.co/kibana/kibana:${ELASTICSEARCH_VERSION:-9.5.4}
    profiles: [elasticsearch]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - TZ=${TZ:-}
      - "ELASTICSEARCH_HOSTS=http://elasticsearch:9200"
    volumes:
      - lds_kb:/usr/share/kibana/data
      - ../../logs/kibana:/usr/share/kibana/logs

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTICSEARCH_VERSION:-9.5.4}
    container_name: FILEBEAT
    restart: unless-stopped
    user: root
    profiles: [filebeat]
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - lds_fbeat:/usr/share/filebeat/data
      - ../conf/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../../logs:/global/log:ro
    command: ["--strict.perms=false"]
    networks:
      - datastore
