name: LocalDevStack

networks:
  frontend:
    name: Frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

  backend:
    name: Backend
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1

  datastore:
    name: DataStore
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
volumes:
  lds_fpm_sock:
    name: FPMSocks
    labels:
      com.infocyph.lds: "1"
      com.infocyph.stack: "LocalDevStack"
      com.infocyph.purpose: "PHP-FPM Sockets"
  lds_fpm_pools:
    name: FPMPools
    labels:
      com.infocyph.lds: "1"
      com.infocyph.stack: "LocalDevStack"
      com.infocyph.purpose: "PHP-FPM Pools"
  lds_ssl_keys:
    name: SSLKeys
    labels:
      com.infocyph.lds: "1"
      com.infocyph.stack: "LocalDevStack"
      com.infocyph.purpose: "SSL Keys"
  lds_ssl_roots:
    name: SSLRootCA
    labels:
      com.infocyph.lds: "1"
      com.infocyph.stack: "LocalDevStack"
      com.infocyph.purpose: "SSL Root CA"
  lds_nginx_host:
    name: NginxHosts
    labels:
      com.infocyph.lds: "1"
      com.infocyph.stack: "LocalDevStack"
      com.infocyph.purpose: "Nginx Host Configs"
  lds_apache_host:
    name: ApacheHosts
    labels:
      com.infocyph.lds: "1"
      com.infocyph.stack: "LocalDevStack"
      com.infocyph.purpose: "Apache Host Configs"

include:
  - docker/compose/companion.yaml
  - docker/compose/db.yaml
  - docker/compose/db-client.yaml
  - docker/compose/php.yaml
  - docker/compose/http.yaml
