name: LocalDevStack

networks:
  frontend:
    name: Frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

  backend:
    name: Backend
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1

  datastore:
    name: DataStore
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
volumes:
  php_fpm_run:
    name: FPMStore
    labels:
      com.infocyph.lds: "1"
      com.infocyph.stack: "LocalDevStack"
      com.infocyph.purpose: "php-fpm sockets"

include:
  - docker/compose/companion.yaml
  - docker/compose/db.yaml
  - docker/compose/db-client.yaml
  - docker/compose/php.yaml
  - docker/compose/http.yaml
